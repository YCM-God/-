<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语背单词 · 四级高频词汇</title>
<style>
  /* ==================== 全局样式与主题变量 ==================== */
  :root {
    /* 浅色主题变量 */
    --bg: #e9f3e6;
    --card-bg: rgba(255, 255, 255, 0.78);
    --text: #1f2430;
    --text-sub: #6b7280;
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --success: #22c55e;
    --danger: #ef4444;
    --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(31, 36, 48, 0.08);
    --chip-bg: #eef1ff;
  }

  /* 深色主题：给 <html> 或 <body> 加 .dark 类后覆盖变量 */
  body.dark {
    --bg: #16211a;
    --card-bg: rgba(28, 31, 43, 0.80);
    --text: #e6e8ef;
    --text-sub: #9aa1b2;
    --primary: #6b84ff;
    --primary-dark: #5870e8;
    --success: #34d399;
    --danger: #f87171;
    --border: #3a4a3e;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --chip-bg: rgba(38, 43, 59, 0.85);
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(255, 255, 255, 0.07), transparent 62%),
      linear-gradient(160deg, #1c2a20 0%, #17241b 42%, #122019 100%);
    background-attachment: fixed;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(255, 255, 255, 0.55), transparent 62%),
      linear-gradient(160deg, #eaf6e7 0%, #dcefd4 34%, #cbe6c2 68%, #b9dcb0 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    transition: background .3s, color .3s;
    -webkit-tap-highlight-color: transparent;
  }

  /* ==================== 布局容器 ==================== */
  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
  }

  /* ==================== 顶部栏 ==================== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 700;
  }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s;
  }
  .icon-btn:hover { transform: translateY(-1px); background: var(--chip-bg); }
  .icon-btn:active { transform: scale(.95); }

  /* ==================== 统计面板 ==================== */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .num {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
  }
  .stat-card .label {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 4px;
  }

  /* ==================== 模式切换 ==================== */
  .mode-tabs {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
    gap: 4px;
  }
  .mode-tabs button {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .mode-tabs button.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(79, 110, 247, .35);
  }

  /* ==================== 卡片 ==================== */
  .card-wrap {
    perspective: 1200px;
    margin-bottom: 16px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 360px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .5s;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card-back { transform: rotateY(180deg); }

  .word {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: .5px;
  }
  .phonetic {
    font-size: 15px;
    color: var(--text-sub);
    margin-top: 8px;
    font-style: normal;
  }
  .meaning {
    font-size: 22px;
    margin-top: 16px;
    font-weight: 600;
  }
  .example {
    margin-top: 12px;
    padding: 8px 12px;
    background: var(--chip-bg);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-sub);
    line-height: 1.5;
    text-align: left;
    width: 100%;
  }
  .example .en { font-style: italic; color: var(--text); }
  .example .cn { margin-top: 3px; }
  .hint {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 18px;
  }
  .speak-btn {
    margin-top: 16px;
    border: none;
    background: var(--chip-bg);
    color: var(--primary);
    font-size: 22px;
    width: 52px; height: 52px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform .15s;
  }
  .speak-btn:hover { transform: scale(1.08); }
  .speak-btn:active { transform: scale(.94); }

  /* ==================== 认识 / 不认识按钮 ==================== */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn {
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: transform .15s, filter .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn.dont { background: var(--danger); }
  .btn.know { background: var(--success); }
  .btn:hover { filter: brightness(1.08); }

  /* ==================== 拼写自测模式 ==================== */
  .spell-panel { display: none; }
  .spell-panel.visible { display: block; }

  .spell-word {
    font-size: 44px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 6px;
  }
  .spell-pos {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    margin-bottom: 20px;
  }
  #spell-input {
    width: 100%;
    padding: 16px;
    font-size: 20px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    text-align: center;
    letter-spacing: 1px;
    transition: border-color .2s;
  }
  #spell-input:focus { border-color: var(--primary); }

  .spell-result {
    margin-top: 14px;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    text-align: center;
    display: none;
  }
  .spell-result.correct { display: block; background: rgba(34,197,94,.12); color: var(--success); }
  .spell-result.wrong { display: block; background: rgba(239,68,68,.12); color: var(--danger); }

  .spell-actions { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn.check { background: var(--primary); grid-column: 1 / -1; }
  .btn.skip { background: var(--text-sub); }

  /* ==================== 听音选义模式 ==================== */
  .listen-panel { display: none; }
  .listen-panel.visible { display: block; }

  .listen-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 16px;
  }
  .listen-play {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(79, 110, 247, .4);
    transition: transform .15s;
  }
  .listen-play:hover { transform: scale(1.06); }
  .listen-play:active { transform: scale(.94); }
  .listen-hint {
    margin-top: 14px;
    color: var(--text-sub);
    font-size: 13px;
  }

  .listen-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .listen-opt {
    padding: 16px 12px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    min-height: 56px;
    line-height: 1.4;
  }
  .listen-opt:hover { border-color: var(--primary); }
  .listen-opt.correct { border-color: var(--success); background: rgba(34,197,94,.12); color: var(--success); }
  .listen-opt.wrong { border-color: var(--danger); background: rgba(239,68,68,.12); color: var(--danger); }

  .listen-result {
    margin-top: 14px;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    text-align: center;
    display: none;
  }
  .listen-result.correct { display: block; background: rgba(34,197,94,.12); color: var(--success); }
  .listen-result.wrong { display: block; background: rgba(239,68,68,.12); color: var(--danger); }

  /* ==================== 错题本 ==================== */
  .icon-btn { position: relative; }
  .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--danger); color: #fff;
    font-size: 10px; min-width: 16px; height: 16px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    padding: 0 4px; line-height: 1;
  }
  .badge.zero { display: none; }

  .review-banner {
    display: none;
    align-items: center; justify-content: space-between;
    gap: 10px;
    background: rgba(79, 110, 247, .12);
    border: 1px solid var(--primary);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--primary);
  }
  .review-banner.visible { display: flex; }
  .review-banner button {
    border: none; background: var(--primary); color: #fff;
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }

  .wrongbook-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .wrongbook-overlay.visible { display: flex; }
  .wrongbook {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%; max-width: 520px;
    max-height: 82vh;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .wrongbook-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .wrongbook-head h2 { font-size: 18px; font-weight: 700; }
  .wrongbook-meta { padding: 10px 20px; font-size: 13px; color: var(--text-sub); }
  .wrongbook-list { flex: 1; overflow-y: auto; padding: 4px 12px; }
  .wb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 8px; border-bottom: 1px solid var(--border);
  }
  .wb-item:last-child { border-bottom: none; }
  .wb-main { flex: 1; min-width: 0; }
  .wb-word { font-weight: 700; font-size: 16px; }
  .wb-mean { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .wb-speak, .wb-remove { flex-shrink: 0; }
  .wb-remove { color: var(--success); }
  .wb-empty { text-align: center; color: var(--text-sub); padding: 48px 0; font-size: 15px; }
  .wrongbook-foot {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border);
  }
  .btn.review { background: var(--primary); }
  .btn.clear { background: var(--text-sub); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  /* ==================== 提示与响应式 ==================== */
  .tip {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    margin-top: 16px;
    line-height: 1.6;
  }
  .progress {
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    margin-bottom: 10px;
  }

  @media (max-width: 480px) {
    .card { height: 340px; }
    .word { font-size: 32px; }
    .meaning { font-size: 19px; }
    .spell-word { font-size: 36px; }
  }

  /* ==================== 森林背景与落叶动画 ==================== */
  .leaves {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
  }
  .leaf {
    position: absolute;
    top: -8vh;
    opacity: 0;
    animation-name: leafDrift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: 15s;
    user-select: none;
    will-change: transform;
  }
  @keyframes leafDrift {
    0%   { transform: translate3d(0, -6vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .5; }
    50%  { transform: translate3d(4vw, 46vh, 0) rotate(170deg); opacity: .5; }
    92%  { opacity: .45; }
    100% { transform: translate3d(-3vw, 108vh, 0) rotate(340deg); opacity: 0; }
  }

  /* 半透明卡片统一毛玻璃效果 */
  .stat-card, .card-face, .listen-box, .mode-tabs, .wrongbook, .review-banner,
  .quiz-setup, .quiz-question, .quiz-report, .ai-window {
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* ==================== 单词测验 ==================== */
  .quiz-panel { display: none; }
  .quiz-panel.visible { display: block; }
  .quiz-setup, .quiz-question, .quiz-report {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .quiz-setup h3, .quiz-report h3 {
    font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 16px;
  }
  .quiz-field { margin-bottom: 14px; }
  .quiz-field label {
    display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px;
  }
  .quiz-seg { display: flex; gap: 8px; }
  .quiz-seg button {
    flex: 1; padding: 9px 0; border: 1px solid var(--border);
    background: var(--chip-bg); color: var(--text); border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .quiz-seg button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.start { background: var(--primary); width: 100%; }

  .quiz-qtype {
    text-align: center; font-size: 13px; color: var(--text-sub); margin-bottom: 8px;
  }
  .quiz-prompt {
    font-size: 38px; font-weight: 800; text-align: center; margin: 10px 0 18px;
    letter-spacing: .5px;
  }
  .quiz-blank-meaning {
    font-size: 24px; font-weight: 700; text-align: center; margin: 16px 0 20px;
    line-height: 1.5;
  }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quiz-opt {
    padding: 14px 12px; border: 2px solid var(--border); border-radius: 14px;
    background: var(--card-bg); color: var(--text); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .15s; line-height: 1.4; min-height: 54px;
  }
  .quiz-opt:hover { border-color: var(--primary); }
  .quiz-opt.correct { border-color: var(--success); background: rgba(34,197,94,.14); color: var(--success); }
  .quiz-opt.wrong { border-color: var(--danger); background: rgba(239,68,68,.14); color: var(--danger); }
  .quiz-opt:disabled { cursor: default; }
  #quiz-input {
    width: 100%; padding: 15px; font-size: 19px; border: 2px solid var(--border);
    border-radius: 14px; background: var(--card-bg); color: var(--text); outline: none;
    text-align: center; letter-spacing: 1px; transition: border-color .2s;
  }
  #quiz-input:focus { border-color: var(--primary); }
  #quiz-submit { width: 100%; margin-top: 12px; }
  .quiz-feedback {
    margin-top: 14px; padding: 14px; border-radius: 12px; font-size: 15px;
    text-align: center; display: none;
  }
  .quiz-feedback.correct { display: block; background: rgba(34,197,94,.12); color: var(--success); }
  .quiz-feedback.wrong { display: block; background: rgba(239,68,68,.12); color: var(--danger); }

  .quiz-score { font-size: 40px; font-weight: 800; text-align: center; color: var(--primary); }
  .quiz-acc { text-align: center; color: var(--text-sub); font-size: 14px; margin: 6px 0 16px; }
  .quiz-wrong-list { margin-bottom: 16px; }
  .quiz-wrong-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 10px;
    border-bottom: 1px solid var(--border);
  }
  .quiz-wrong-item:last-child { border-bottom: none; }
  .qw-main { flex: 1; min-width: 0; }
  .qw-word { font-weight: 700; font-size: 16px; }
  .qw-mean { font-size: 13px; color: var(--text-sub); margin-top: 3px; }
  .quiz-report-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quiz-empty { text-align: center; color: var(--text-sub); padding: 16px 0; font-size: 15px; }

  /* ==================== AI 单词助手 ==================== */
  .ai-fab {
    position: fixed; right: 20px; bottom: 20px; z-index: 200;
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 26px;
    box-shadow: 0 8px 22px rgba(0,0,0,.28); transition: transform .15s;
  }
  .ai-fab:hover { transform: scale(1.08); }
  .ai-fab:active { transform: scale(.95); }
  .ai-window {
    position: fixed; right: 20px; bottom: 92px; z-index: 200;
    width: min(340px, calc(100vw - 32px)); height: 480px;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(20px) scale(.96); opacity: 0; pointer-events: none;
    transition: transform .22s, opacity .22s;
  }
  .ai-window.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
  .ai-head {
    display: flex; align-items: center; gap: 8px; padding: 13px 16px;
    border-bottom: 1px solid var(--border); font-weight: 700; font-size: 15px;
  }
  .ai-head .title { flex: 1; }
  .ai-head .icon-btn { width: 32px; height: 32px; font-size: 15px; }
  .ai-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .ai-msg { max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .ai-msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .ai-msg.assistant { align-self: flex-start; background: var(--chip-bg); color: var(--text); border-bottom-left-radius: 4px; }
  .ai-msg.sys { align-self: center; background: transparent; color: var(--text-sub); font-size: 12px; text-align: center; }
  .ai-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .ai-foot input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--chip-bg); color: var(--text); outline: none; font-size: 14px;
  }
  .ai-foot input:focus { border-color: var(--primary); }
  .ai-foot button { padding: 0 16px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; }

  /* 选中单词后浮现的查询按钮 */
  .ai-tooltip {
    position: fixed; z-index: 300; transform: translate(-50%, -120%);
    background: var(--primary); color: #fff; border: none; border-radius: 999px;
    padding: 7px 13px; font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.25); display: none;
  }

  /* ==================== 四六级刷题 ==================== */
  .cet-panel { display: none; }
  .cet-panel.visible { display: block; }
  .cet-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .cet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .cet-level-seg { flex: 1; min-width: 170px; }
  .cet-stat { font-size: 13px; color: var(--text-sub); white-space: nowrap; }
  .cet-tag { font-size: 13px; color: var(--text-sub); text-align: center; margin-bottom: 8px; }

/* ===================================================================
 * 核心数据与状态管理
 * =================================================================== */
const STORAGE_KEY = "wordbook_records_v1";   // localStorage 存储键名

// 默认学习记录结构
const DEFAULT_DATA = {
  records: {},          // { 单词: { count: 学习次数, correct: 正确次数, know: 是否认识 } }
  today: "2026-01-01",  // 记录今日学习对应的日期
  todayCount: 0,        // 今日学习数量
  totalCount: 0,        // 累计学习数量
  totalCorrect: 0,      // 累计正确次数
  wrongBook: []         // 错题本：存放答错/不认识的单词
};

let data = loadData();          // 从 localStorage 加载数据
let currentWord = null;         // 当前正在学习的单词对象
let currentIndex = -1;          // 当前单词在复习队列中的下标
let queue = [];                 // 复习队列（生词排在前面）
let mode = "card";              // 当前模式：card / spell / listen / quiz
let listenOptions = [];         // 当前听音题的选项列表
let listenAnswered = false;     // 当前听音题是否已作答
let spellAnswered = false;      // 当前拼写题是否已作答（防止重复判定）
let reviewingWrong = false;     // 是否正在复习（错题本或测验错题）
let reviewSource = null;        // 复习单词列表（null 表示正常学习全部词库）

/* ---------- 单词测验状态 ---------- */
let quiz = null;                // 当前测验对象 { list, index, correct, wrong, answered, currentType, options }
let quizCount = 10;             // 默认题量
let quizType = "mix";           // 题型：choice / blank / mix

/* ---------- 数据持久化 ---------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // 合并默认值，防止旧数据结构缺少字段导致报错
      return { ...DEFAULT_DATA, ...parsed, records: parsed.records || {}, wrongBook: Array.isArray(parsed.wrongBook) ? parsed.wrongBook : [] };
    }
  } catch (e) { /* 数据损坏时忽略，重新开始 */ }
  return { ...DEFAULT_DATA, records: {} };
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { /* 存储失败（如隐私模式）时静默处理 */ }
}

/* ===================================================================
 * 复习队列：生词优先
 * 每个单词维护一个“待复习权重”，不认识的词权重更高、更靠前
 * =================================================================== */
function buildQueue() {
  // 复习模式只对复习列表中的单词建队，否则使用完整词库
  let source = WORDS;
  if (reviewSource) {
    const ws = WORDS.filter(function (w) {
      return reviewSource.indexOf(w.word) !== -1;
    });
    if (ws.length > 0) {
      source = ws;
    } else {
      // 复习过程中单词全部掌握，自动退出复习模式
      exitWrongReview();
      return;
    }
  }

  // 计算每个单词的复习优先级：不认识记 2 分，认识记 0 分，从未学过的记 1 分
  const scored = source.map(function (w, idx) {
    const rec = data.records[w.word];
    let priority = 1; // 默认：新词
    if (rec) {
      priority = rec.know ? 0 : 2; // 认识=0（靠后），不认识=2（最优先）
    }
    // 加入少量随机扰动，避免每次都按固定顺序
    return { word: w, idx: idx, priority: priority + Math.random() * 0.5 };
  });
  // 按优先级降序排列，生词在前
  scored.sort(function (a, b) { return b.priority - a.priority; });
  queue = scored;
  currentIndex = 0;
}

/* 从队列取出当前单词，若走到队尾则重新洗牌建队 */
function nextWord() {
  if (currentIndex >= queue.length) {
    buildQueue(); // 一轮学完，重新按生词优先排序
  }
  currentWord = queue[currentIndex].word;
}

/* ===================================================================
 * 统计面板更新
 * =================================================================== */
function updateStats() {
  // 跨天后重置“今日学习”计数
  const todayStr = new Date().toISOString().slice(0, 10);
  if (data.today !== todayStr) {
    data.today = todayStr;
    data.todayCount = 0;
    saveData();
  }
  document.getElementById("stat-today").textContent = data.todayCount;
  document.getElementById("stat-total").textContent = data.totalCount;
  const rate = data.totalCount === 0
    ? 0
    : Math.round((data.totalCorrect / data.totalCount) * 100);
  document.getElementById("stat-rate").textContent = rate + "%";
}

/* 例句渲染工具：将单词的例句填充到指定前缀的元素中，无例句则隐藏 */
function showExample(prefix) {
  const wrap = document.getElementById(prefix + "-example");
  if (!wrap) return;
  const ex = EXAMPLES[currentWord.word];
  if (!ex) { wrap.style.display = "none"; return; }
  document.getElementById(prefix + "-example-en").textContent = ex.en;
  document.getElementById(prefix + "-example-cn").textContent = ex.cn;
  wrap.style.display = "block";
}

/* ===================================================================
 * 卡片模式渲染
 * =================================================================== */
function renderCard() {
  if (!currentWord) return;
  document.getElementById("front-word").textContent = currentWord.word;

  document.getElementById("back-word").textContent = currentWord.word;

  document.getElementById("card-progress").textContent =

  document.getElementById("card").classList.remove("flipped");

/* ===================================================================
 * 拼写自测模式渲染

/* ===================================================================
 * 记录一次学习结果
 * @param know  是否认识 / 拼写是否正确
 * =================================================================== */
function recordResult(correct) {
  const w = currentWord.word;
  // 初始化该单词的记录
  if (!data.records[w]) {
    data.records[w] = { count: 0, correct: 0, know: false };
  }
  const rec = data.records[w];
  rec.count += 1;
  if (correct) {
    rec.correct += 1;
    rec.know = true;    // 认识 / 拼写正确，标记为已掌握
  } else {
    rec.know = false;   // 不认识 / 拼写错误，标记为生词，下次优先复习
  }

  // 更新错题本：答错加入，答对移出
  if (correct) {
    const wi = data.wrongBook.indexOf(w);
    if (wi !== -1) data.wrongBook.splice(wi, 1);
  } else if (data.wrongBook.indexOf(w) === -1) {
    data.wrongBook.push(w);
  }

  // 更新全局统计
  data.totalCount += 1;
  if (correct) data.totalCorrect += 1;
  data.todayCount += 1;

  saveData();
  updateStats();
  updateWrongBadge();

  // 跳到下一个单词
  currentIndex += 1;
  nextWord();
  renderCurrent();
}

/* 根据当前模式渲染对应界面 */
function renderCurrent() {
  if (mode === "card") {
    renderCard();
  } else if (mode === "spell") {
    renderSpell();
  } else if (mode === "listen") {
    renderListen();
  } else if (mode === "quiz") {
    renderQuizHome();
  } else if (mode === "cet") {
    updateCetStat();
    buildCetQuestion();
  }
}

/* ===================================================================
 * 听音选义模式渲染
 * =================================================================== */
function renderListen() {
  if (!currentWord) return;
  listenAnswered = false;

  // 构造 4 个选项：1 个正确释义 + 3 个从其它单词随机抽取的干扰释义
  const correct = currentWord.meaning;
  const others = WORDS.filter(function (w) { return w.word !== currentWord.word; });
  const distractorMeanings = [];
  const shuffled = shuffleArray(others);
  for (let i = 0; i < shuffled.length && distractorMeanings.length < 3; i++) {
    const m = shuffled[i].meaning;
    // 避免与正确答案或已有干扰项重复
    if (m !== correct && distractorMeanings.indexOf(m) === -1) {
      distractorMeanings.push(m);
    }
  }
  // 若干扰项不足 3 个（极小概率），从整个词库兜底补齐
  if (distractorMeanings.length < 3) {
    const all = WORDS.map(function (w) { return w.meaning; });
    for (let i = 0; i < all.length && distractorMeanings.length < 3; i++) {
      if (all[i] !== correct && distractorMeanings.indexOf(all[i]) === -1) {
        distractorMeanings.push(all[i]);
      }
    }
  }

  // 正确答案 + 干扰项混合后再次洗牌
  listenOptions = shuffleArray([correct].concat(distractorMeanings));

  // 渲染选项按钮
  const box = document.getElementById("listen-options");
  box.innerHTML = "";
  listenOptions.forEach(function (opt, i) {
    const btn = document.createElement("button");
    btn.className = "listen-opt";
    btn.textContent = opt;
    btn.dataset.index = i;
    btn.addEventListener("click", function () { checkListen(i); });
    box.appendChild(btn);
  });

  document.getElementById("listen-result").textContent = "";
  document.getElementById("listen-result").className = "listen-result";
  document.getElementById("listen-progress").textContent =
    "第 " + (currentIndex + 1) + " / " + queue.length + " 个单词";

  // 自动朗读单词
  speak(currentWord.word);
}

/* 数组洗牌工具函数（返回新数组，不修改原数组） */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 听音选义：判断所选选项是否正确 */
function checkListen(index) {
  if (listenAnswered) return; // 已作答，忽略重复点击
  listenAnswered = true;

  const correct = listenOptions[index] === currentWord.meaning;
  const btns = document.querySelectorAll(".listen-opt");
  const resultEl = document.getElementById("listen-result");

  // 高亮：正确选项标绿，选错的标红，并禁用所有选项
  btns.forEach(function (btn, i) {
    btn.disabled = true;
    if (listenOptions[i] === currentWord.meaning) {
      btn.classList.add("correct");
    } else if (i === index) {
      btn.classList.add("wrong");
    }
  });

  if (correct) {
    resultEl.textContent = "✅ 选择正确！ " + currentWord.word + " — " + currentWord.meaning;
    resultEl.className = "listen-result correct";
  } else {
    resultEl.textContent = "❌ 选择错误，正确释义：" + currentWord.meaning;
    resultEl.className = "listen-result wrong";
  }

  // 显示结果后延迟 1.2 秒自动进入下一题
  setTimeout(function () { recordResult(correct); }, 1200);
}

/* ===================================================================
 * 单词朗读（使用浏览器内置语音合成 API，无需联网）
 * =================================================================== */
function speak(word) {
  // 若浏览器不支持语音合成则直接返回
  if (!window.speechSynthesis) return;
  // 先停止上一次尚未结束的朗读，避免重叠
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = "en-US";   // 英语发音
  utter.rate = 0.9;       // 语速稍慢，便于跟读
  window.speechSynthesis.speak(utter);
}

/* 拼写检查逻辑 */
function checkSpell() {
  const input = document.getElementById("spell-input").value.trim();
  if (!input || spellAnswered) return; // 空输入或已作答不处理
  spellAnswered = true;
  const correct = input.toLowerCase() === currentWord.word.toLowerCase();
  const resultEl = document.getElementById("spell-result");

  if (correct) {
    resultEl.textContent = "✅ 回答正确！ " + currentWord.word;
    resultEl.className = "spell-result correct";
  } else {
    resultEl.textContent = "❌ 回答错误，正确答案：" + currentWord.word;
    resultEl.className = "spell-result wrong";
    // 拼错时朗读正确发音，加深记忆
    speak(currentWord.word);
  }
  // 作答后展示该词的例句，帮助在语境中记忆
  showExample("spell");

  // 显示结果后延迟 1.2 秒自动进入下一个词
  setTimeout(function () {
    // 若期间用户已切词，避免重复记录
    recordResult(correct);
  }, 1200);
}

/* ===================================================================
 * 单词测验模块
 * =================================================================== */
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 选择题：为给定单词构造 1 个正确释义 + 3 个干扰释义的选项 */
function buildMeaningOptions(word) {
  const correct = word.meaning;
  const others = WORDS.filter(function (w) { return w.word !== word.word; });
  const distractors = [];
  const shuffled = shuffleArr(others);
  for (let i = 0; i < shuffled.length && distractors.length < 3; i++) {
    const m = shuffled[i].meaning;
    if (m !== correct && distractors.indexOf(m) === -1) distractors.push(m);
  }
  if (distractors.length < 3) {
    const all = WORDS.map(function (w) { return w.meaning; });
    for (let i = 0; i < all.length && distractors.length < 3; i++) {
      if (all[i] !== correct && distractors.indexOf(all[i]) === -1) distractors.push(all[i]);
    }
  }
  return shuffleArr([correct].concat(distractors));
}

/* 测验开始界面（回到选题量/题型界面，并重置当前测验） */
function renderQuizHome() {
  quiz = null;
  document.getElementById("quiz-setup").style.display = "block";
  document.getElementById("quiz-question").style.display = "none";
  document.getElementById("quiz-report").style.display = "none";

  });

    b.classList.toggle("active", b.dataset.t === quizType);
  });
}

/* 开始一场测验 */
function startQuiz() {
  const n = Math.min(quizCount, WORDS.length);
  const list = shuffleArr(WORDS).slice(0, n);
  quiz = { list: list, index: 0, correct: 0, wrong: [], answered: false };
  document.getElementById("quiz-setup").style.display = "none";
  document.getElementById("quiz-question").style.display = "block";
  document.getElementById("quiz-report").style.display = "none";
  renderQuizQuestion();
}

function quizFinished() {
  return quiz && quiz.index >= quiz.list.length;
}

/* 渲染当前题目 */
function renderQuizQuestion() {
  const q = quiz;
  const w = q.list[q.index];
  q.answered = false;
  document.getElementById("quiz-progress").textContent =
    "第 " + (q.index + 1) + " / " + q.list.length + " 题";
  document.getElementById("quiz-feedback").className = "quiz-feedback";
  document.getElementById("quiz-feedback").textContent = "";

  let type = quizType;
  if (type === "mix") type = (q.index % 2 === 0) ? "choice" : "blank";
  q.currentType = type;

  const choiceEl = document.getElementById("quiz-choice");
  const blankEl = document.getElementById("quiz-blank");

  if (type === "choice") {
    choiceEl.style.display = "block";
    blankEl.style.display = "none";
    document.getElementById("quiz-qtype").textContent = "选择题 · 选出正确释义";
    document.getElementById("quiz-choice-prompt").textContent = w.word;
    const options = buildMeaningOptions(w);
    q.options = options;
    const box = document.getElementById("quiz-options");
    box.innerHTML = "";
    options.forEach(function (opt, i) {
      const btn = document.createElement("button");
      btn.className = "quiz-opt";
      btn.textContent = opt;
      btn.dataset.index = i;
      btn.addEventListener("click", function () { checkQuizChoice(i); });
      box.appendChild(btn);
    });
  } else {
    choiceEl.style.display = "none";
    blankEl.style.display = "block";
    document.getElementById("quiz-qtype").textContent = "默写填空 · 根据释义拼写单词";
    document.getElementById("quiz-blank-meaning").textContent = w.meaning;
    const input = document.getElementById("quiz-input");
    input.value = "";
    input.disabled = false;
    setTimeout(function () { input.focus(); }, 50);
  }
}

/* 选择题作答 */
function checkQuizChoice(index) {
  const q = quiz;
  if (!q || q.answered) return;
  q.answered = true;
  const w = q.list[q.index];
  const correct = q.options[index] === w.meaning;
  document.querySelectorAll(".quiz-opt").forEach(function (btn, i) {
    btn.disabled = true;
    if (q.options[i] === w.meaning) btn.classList.add("correct");
    else if (i === index) btn.classList.add("wrong");
  });
  const fb = document.getElementById("quiz-feedback");
  if (correct) {
    fb.textContent = "✅ 正确！ " + w.word + " — " + w.meaning;
    fb.className = "quiz-feedback correct";
  } else {
    fb.textContent = "❌ 错误，正确答案：" + w.meaning;
    fb.className = "quiz-feedback wrong";
  }
  finishQuizAnswer(correct);
}

/* 默写填空题作答 */
function checkQuizBlank() {
  const q = quiz;
  if (!q || q.answered) return;
  const input = document.getElementById("quiz-input");
  const val = input.value.trim();
  if (!val) return;
  q.answered = true;
  input.disabled = true;
  const w = q.list[q.index];
  const correct = val.toLowerCase() === w.word.toLowerCase();
  const fb = document.getElementById("quiz-feedback");
  if (correct) {
    fb.textContent = "✅ 拼写正确！ " + w.word;
    fb.className = "quiz-feedback correct";
  } else {
    fb.textContent = "❌ 拼写错误，正确答案：" + w.word;
    fb.className = "quiz-feedback wrong";
  }
  finishQuizAnswer(correct);
}

/* 记录本题结果并进入下一题或显示报告 */
function finishQuizAnswer(correct) {
  const q = quiz;
  const w = q.list[q.index];
  if (correct) {
    q.correct += 1;
  } else {
    q.wrong.push({ word: w.word, meaning: w.meaning, phonetic: w.phonetic });
    // 错题自动存入错题本
    if (data.wrongBook.indexOf(w.word) === -1) {
      data.wrongBook.push(w.word);
      saveData();
      updateWrongBadge();
    }
  }
  setTimeout(function () {
    q.index += 1;
    if (quizFinished()) {
      renderQuizReport();
    } else {
      renderQuizQuestion();
    }
  }, 900);
}

/* 生成测验报告：错题列表 + 正确率 */
function renderQuizReport() {
  const q = quiz;
  document.getElementById("quiz-question").style.display = "none";
  document.getElementById("quiz-setup").style.display = "none";
  document.getElementById("quiz-report").style.display = "block";

  const total = q.list.length;
  const acc = Math.round((q.correct / total) * 100);
  document.getElementById("quiz-score").textContent = q.correct + " / " + total;
  document.getElementById("quiz-acc").textContent = "正确率 " + acc + "%";

  const list = document.getElementById("quiz-wrong-list");
  list.innerHTML = "";
  if (q.wrong.length === 0) {
    list.innerHTML = '<div class="quiz-empty">🎉 全部答对，太棒了！</div>';
    document.getElementById("quiz-to-review").style.display = "none";
  } else {
    document.getElementById("quiz-to-review").style.display = "block";
    q.wrong.forEach(function (item) {
      const div = document.createElement("div");
      div.className = "quiz-wrong-item";
      const main = document.createElement("div");
      main.className = "qw-main";
      const w = document.createElement("div");
      w.className = "qw-word";
      w.textContent = item.word;
      const m = document.createElement("div");
      m.className = "qw-mean";
      m.textContent = item.meaning;
      main.appendChild(w);
      main.appendChild(m);
      const spk = document.createElement("button");
      spk.className = "icon-btn";
      spk.style.cssText = "width:34px;height:34px;font-size:15px;flex-shrink:0";
      spk.textContent = "🔊";
      spk.title = "朗读";
      spk.addEventListener("click", function () { speak(item.word); });
      div.appendChild(main);
      div.appendChild(spk);
      list.appendChild(div);
    });
  }
}

const CHAT_KEY = "wordbook_chat_v1";

function loadChat() {
  try {
    const raw = localStorage.getItem(CHAT_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

function saveChat() {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify(chatHistory)); } catch (e) {}
}

function clearChat() {
  chatHistory = [];
  saveChat();
  renderChat();
}

function pushChat(role, text) {
  chatHistory.push({ role: role, text: text, time: Date.now() });
  if (chatHistory.length > 200) chatHistory = chatHistory.slice(-200);
  saveChat();
  renderChat();
}

function renderChat() {
  const body = document.getElementById("ai-body");
  body.innerHTML = "";
  if (chatHistory.length === 0) {
    body.innerHTML = '<div class="ai-msg sys">在页面上选中任意单词，点击「🔍 查 AI」即可查询；也可以直接输入单词。</div>';
    return;
  }
  chatHistory.forEach(function (m) {
    const div = document.createElement("div");
    div.className = "ai-msg " + m.role;
    div.textContent = m.text;
    body.appendChild(div);
  });
  body.scrollTop = body.scrollHeight;
}

/* 本地离线兜底：基于内置词库生成回答 */
function buildLocalAnswer(word) {
  const w = WORDS.find(function (x) { return x.word.toLowerCase() === word.toLowerCase(); });
  if (w) {
    const ex = EXAMPLES[w.word];
    let s = "";
    s += "📖 释义：" + w.meaning + "\n";
    s += "🔤 音标：" + w.phonetic + "\n";
    if (ex) s += "🌰 例句：" + ex.en + "\n（" + ex.cn + "）\n";
    s += "🔗 词根 / 🧠 记忆口诀：当前为离线模式，配置 AI_CONFIG.endpoint 接入大模型后即可获取。";
    return s;
  }
  return "抱歉，本地词库中暂未收录「" + word + "」。\n配置 AI_CONFIG.endpoint 接入大模型后，可查询任意单词的释义、词根、记忆口诀和例句。";
}

/* 请求 AI（预留接口）：优先调用 endpoint，未配置则本地兜底 */
async function fetchAI(word, history) {
  if (AI_CONFIG.endpoint) {
    try {
      const resp = await fetch(AI_CONFIG.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word: word, history: history })
      });
      const data = await resp.json();
      return data.text || data.content || data.message || JSON.stringify(data);
    } catch (e) {
      return "⚠️ 请求 AI 接口失败，已切换为本地离线回答：\n\n" + buildLocalAnswer(word);
    }
  }
  return buildLocalAnswer(word);
}

/* 查询某个单词，展示 AI 回答 */
async function queryAIWord(word, userText) {
  openAIWindow();
  pushChat("user", userText || ("查一下：「" + word + "」"));
  pushChat("assistant", "🤔 正在查询…");
  const answer = await fetchAI(word, chatHistory);
  chatHistory[chatHistory.length - 1].text = answer;
  saveChat();
  renderChat();
}

function openAIWindow() {
  document.getElementById("ai-window").classList.add("open");
}

function sendChatFromInput() {
  const input = document.getElementById("ai-input");
  const val = input.value.trim();
  if (!val) return;
  input.value = "";
  const wordMatch = val.match(/[A-Za-z][A-Za-z'-]*/);
  if (wordMatch) {
    queryAIWord(wordMatch[0], val);
  } else {
    pushChat("user", val);
    pushChat("assistant", "请输入英文单词，例如：abandon");
  }
}

/* 选中单词工具 */
function getSelectedWord() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return "";
  const t = sel.toString().trim();
  if (/^[A-Za-z][A-Za-z'-]{0,19}$/.test(t)) return t;
  return "";
}

function showWordTooltip(x, y, word) {
  const tip = document.getElementById("ai-tooltip");
  tip.textContent = "🔍 查「" + word + "」";
  tip.dataset.word = word;
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let left = x;
  if (left + r.width / 2 > window.innerWidth) left = window.innerWidth - r.width / 2 - 8;
  if (left - r.width / 2 < 8) left = r.width / 2 + 8;
  tip.style.left = left + "px";
  tip.style.top = (y - 12) + "px";
}

function hideWordTooltip() {
  document.getElementById("ai-tooltip").style.display = "none";
}

/* 生成森林背景漂浮落叶 */
function createLeaves() {
  const box = document.getElementById("leaves");
  if (!box) return;
  const chars = ["🍃", "🍂", "🍀", "🌿"];
  for (let i = 0; i < 14; i++) {
    const leaf = document.createElement("span");
    leaf.className = "leaf";
    leaf.textContent = chars[i % chars.length];
    leaf.style.left = (Math.random() * 100) + "vw";
    leaf.style.fontSize = (14 + Math.random() * 18) + "px";
    leaf.style.animationDuration = (12 + Math.random() * 14) + "s";
    leaf.style.animationDelay = (-Math.random() * 20) + "s";
    box.appendChild(leaf);
  }
}

  { word: "disclose", phonetic: "/dɪsˈkloʊz/", meaning: "v. 揭露；透露", en: "The company refused to disclose the figures.", cn: "该公司拒绝透露这些数字。" },

  { word: "dispose", phonetic: "/dɪˈspoʊz/", meaning: "v. 处理；处置", en: "Please dispose of the waste properly.", cn: "请妥善处理垃圾。" },
  { word: "disrupt", phonetic: "/dɪsˈrʌpt/", meaning: "v. 扰乱；中断", en: "The storm disrupted the power supply.", cn: "暴风雨中断了电力供应。" },
  { word: "dissolve", phonetic: "/dɪˈzɑːlv/", meaning: "v. 溶解；解散", en: "Sugar dissolves quickly in hot water.", cn: "糖在热水中溶解得很快。" },
  { word: "distinct", phonetic: "/dɪˈstɪŋkt/", meaning: "adj. 明显的；独特的", en: "The two species are quite distinct.", cn: "这两个物种截然不同。" },
  { word: "distort", phonetic: "/dɪˈstɔːrt/", meaning: "v. 扭曲；歪曲", en: "The media distorted the facts.", cn: "媒体歪曲了事实。" },
  { word: "distract", phonetic: "/dɪˈstrækt/", meaning: "v. 使分心", en: "The noise distracted me from my work.", cn: "噪音使我无法专心工作。" },
  { word: "doctrine", phonetic: "/ˈdɑːktrɪn/", meaning: "n. 教义；学说", en: "The church teaches a strict doctrine.", cn: "教会传授严格的教义。" },
  { word: "dominant", phonetic: "/ˈdɑːmɪnənt/", meaning: "adj. 占主导的；支配的", en: "The company holds a dominant market position.", cn: "该公司在市场上占据主导地位。" },
  { word: "donate", phonetic: "/ˈdoʊneɪt/", meaning: "v. 捐赠", en: "He donated blood to the hospital.", cn: "他向医院献血。" },
  { word: "drastic", phonetic: "/ˈdræstɪk/", meaning: "adj. 剧烈的；激烈的", en: "Drastic measures are needed to solve the problem.", cn: "需要采取严厉措施解决这个问题。" }
];

const CET_STORAGE = "wordbook_cet_v1";
let cetLevel = 4;         // 当前题库：4 四级 / 6 六级
let cetQ = null;          // 当前题目对象
let cetDrillWords = null; // 重刷错题时的词表（null 表示常规随机出题）

let cetData = loadCetData();

function loadCetData() {
  try {
    const raw = localStorage.getItem(CET_STORAGE);
    if (raw) {
      const d = JSON.parse(raw);
      return { total: d.total || 0, correct: d.correct || 0, wrongBook: d.wrongBook || [] };
    }
  } catch (e) {}
  return { total: 0, correct: 0, wrongBook: [] };
}

function saveCetData() {
  try { localStorage.setItem(CET_STORAGE, JSON.stringify(cetData)); } catch (e) {}
}

function cetLevelName(level) {
  return level === 4 ? "四级" : "六级";
}

function updateCetStat() {
  const acc = cetData.total === 0 ? 0 : Math.round((cetData.correct / cetData.total) * 100);
  document.getElementById("cet-stat").textContent =
    "已刷 " + cetData.total + " 题 · 正确率 " + acc + "%";
}

/* 生成一道随机单选题（词义选择 / 反选单词） */
function buildCetQuestion() {
  let target;
  if (cetDrillWords && cetDrillWords.length > 0) {
    target = cetDrillWords.shift(); // 重刷错题时按序取出
    if (cetDrillWords.length === 0) cetDrillWords = null;
  } else {
    const bank = cetLevel === 4 ? WORDS : CET6_WORDS;
    const w = bank[Math.floor(Math.random() * bank.length)];
    target = { word: w.word, phonetic: w.phonetic, meaning: w.meaning, level: cetLevel };
  }
  const type = Math.random() < 0.5 ? "meaning" : "word";
  const options = buildCetOptions(target, type);
  cetQ = {
    level: target.level, word: target.word, phonetic: target.phonetic, meaning: target.meaning,
    type: type, options: options, answer: type === "meaning" ? target.meaning : target.word,
    answered: false, selected: null
  };
  renderCetQuestion();
}

/* 为题目构造 1 个正确 + 3 个干扰选项 */
function buildCetOptions(target, type) {
  const bank = target.level === 4 ? WORDS : CET6_WORDS;
  const correct = type === "meaning" ? target.meaning : target.word;
  const others = bank.filter(function (w) { return w.word !== target.word; });
  const distractors = [];
  const shuffled = shuffleArr(others);
  for (let i = 0; i < shuffled.length && distractors.length < 3; i++) {
    const val = type === "meaning" ? shuffled[i].meaning : shuffled[i].word;
    if (val !== correct && distractors.indexOf(val) === -1) distractors.push(val);
  }
  if (distractors.length < 3) {
    const all = bank.map(function (w) { return type === "meaning" ? w.meaning : w.word; });
    for (let i = 0; i < all.length && distractors.length < 3; i++) {
      if (all[i] !== correct && distractors.indexOf(all[i]) === -1) distractors.push(all[i]);
    }
  }
  return shuffleArr([correct].concat(distractors));
}

/* 渲染当前题目 */
function renderCetQuestion() {
  const q = cetQ;
  document.getElementById("cet-tag").textContent =
    cetLevelName(q.level) + " · " + (q.type === "meaning" ? "词义选择" : "反选单词");
  document.getElementById("cet-stem").textContent =
    q.type === "meaning"
      ? ("「" + q.word + "」的正确释义是？")
      : ("「" + q.meaning + "」对应的英文单词是？");

  const box = document.getElementById("cet-options");
  box.innerHTML = "";
  const letters = ["A", "B", "C", "D"];
  q.options.forEach(function (opt, i) {
    const btn = document.createElement("button");
    btn.className = "cet-opt";
    btn.textContent = letters[i] + ". " + opt;
    btn.dataset.index = i;
    btn.addEventListener("click", function () { selectCetOption(i); });
    box.appendChild(btn);
  });

  document.getElementById("cet-submit").disabled = true;
  document.getElementById("cet-submit").style.display = "block";
  document.getElementById("cet-result").className = "quiz-feedback";
  document.getElementById("cet-result").textContent = "";
  document.getElementById("cet-explain").style.display = "none";
  document.getElementById("cet-explain").innerHTML = "";
  document.getElementById("cet-next").style.display = "none";
}

/* 选择某个选项 */
function selectCetOption(i) {
  if (!cetQ || cetQ.answered) return;
  cetQ.selected = i;
  document.querySelectorAll(".cet-opt").forEach(function (btn, idx) {
    btn.classList.toggle("selected", idx === i);
  });
  document.getElementById("cet-submit").disabled = false;
}

/* 提交答案并自动判分 */
function checkCetAnswer() {
  if (!cetQ || cetQ.answered || cetQ.selected === null) return;
  const q = cetQ;
  q.answered = true;
  const correct = q.options[q.selected] === q.answer;

  document.querySelectorAll(".cet-opt").forEach(function (btn, i) {
    btn.disabled = true;
    btn.classList.remove("selected");
    if (q.options[i] === q.answer) btn.classList.add("correct");
    else if (i === q.selected) btn.classList.add("wrong");
  });
  document.getElementById("cet-submit").style.display = "none";

  const resultEl = document.getElementById("cet-result");
  if (correct) {
    resultEl.textContent = "✅ 回答正确！";
    resultEl.className = "quiz-feedback correct";
  } else {
    resultEl.textContent = "❌ 回答错误，正确答案：" + q.answer;
    resultEl.className = "quiz-feedback wrong";
  }

  // 统计刷题数量与正确率
  cetData.total += 1;
  if (correct) {
    cetData.correct += 1;
  } else {
    // 错题自动存入四六级错题本（按 单词 + 级别 去重）
    const exists = cetData.wrongBook.some(function (x) { return x.word === q.word && x.level === q.level; });
    if (!exists) {
      cetData.wrongBook.push({ word: q.word, level: q.level, meaning: q.meaning, phonetic: q.phonetic });
    }
  }
  saveCetData();
  updateCetStat();

  renderCetExplain();
  document.getElementById("cet-next").style.display = "block";
}

/* 展示题目解析（释义 + 音标 + 例句） */
function renderCetExplain() {
  const q = cetQ;
  let ex = null;
  if (q.level === 4) {
    const e = EXAMPLES[q.word];
    if (e) ex = { en: e.en, cn: e.cn };
  } else {
    const w = CET6_WORDS.find(function (x) { return x.word === q.word; });
    if (w && w.en) ex = { en: w.en, cn: w.cn };
  }
  const el = document.getElementById("cet-explain");
  let html = '<div class="ce-title">📖 解析</div>';
  html += "<div>单词：" + q.word + " <span style='color:var(--text-sub)'>" + q.phonetic + "</span></div>";
  html += "<div>释义：" + q.meaning + "</div>";
  if (ex) {
    html += "<div>例句：" + ex.en + "</div>";
    html += "<div style='color:var(--text-sub)'>译：" + ex.cn + "</div>";
  }
  el.innerHTML = html;
  el.style.display = "block";
}

/* ===== 四六级错题本 ===== */
function openCetWrongBook() {
  renderCetWrongBook();
  document.getElementById("cet-wb-overlay").classList.add("visible");
}
function closeCetWrongBook() {
  document.getElementById("cet-wb-overlay").classList.remove("visible");
}
function renderCetWrongBook() {
  const list = document.getElementById("cet-wb-list");
  list.innerHTML = "";
  document.getElementById("cet-wb-meta").textContent = "共 " + cetData.wrongBook.length + " 个错题";
  if (cetData.wrongBook.length === 0) {
    list.innerHTML = '<div class="wb-empty">🎉 太棒了，暂无四六级错题！</div>';
    document.getElementById("cet-wb-review").disabled = true;
    document.getElementById("cet-wb-clear").disabled = true;
    return;
  }
  document.getElementById("cet-wb-review").disabled = false;
  document.getElementById("cet-wb-clear").disabled = false;

  cetData.wrongBook.forEach(function (item) {
    const div = document.createElement("div");
    div.className = "wb-item";

    const main = document.createElement("div");
    main.className = "wb-main";
    const wordEl = document.createElement("div");
    wordEl.className = "wb-word";
    const badge = document.createElement("span");
    badge.className = "cet-wb-badge";
    badge.textContent = cetLevelName(item.level);
    wordEl.appendChild(badge);
    wordEl.appendChild(document.createTextNode(item.word));
    const phEl = document.createElement("span");
    phEl.style.cssText = "color:var(--text-sub);font-size:12px;font-weight:400";
    phEl.textContent = " " + item.phonetic;
    wordEl.appendChild(phEl);
    const meanEl = document.createElement("div");
    meanEl.className = "wb-mean";
    meanEl.textContent = item.meaning;
    main.appendChild(wordEl);
    main.appendChild(meanEl);

    const speakBtn = document.createElement("button");
    speakBtn.className = "icon-btn wb-speak";
    speakBtn.textContent = "🔊";
    speakBtn.title = "朗读";
    speakBtn.addEventListener("click", function () { speak(item.word); });

    const rmBtn = document.createElement("button");
    rmBtn.className = "icon-btn wb-remove";
    rmBtn.textContent = "✓";
    rmBtn.title = "标记已掌握并移除";
    rmBtn.addEventListener("click", function () {
      cetData.wrongBook = cetData.wrongBook.filter(function (x) {
        return !(x.word === item.word && x.level === item.level);
      });
      saveCetData();
      renderCetWrongBook();
    });

    div.appendChild(main);
    div.appendChild(speakBtn);
    div.appendChild(rmBtn);
    list.appendChild(div);
  });
}

/* 重刷错题：仅从错题中出题，刷完自动回到常规题库 */
function startCetDrill() {
  if (cetData.wrongBook.length === 0) return;
  cetDrillWords = shuffleArr(cetData.wrongBook);
  closeCetWrongBook();
  buildCetQuestion();
}

/* ===================================================================
 * 初始化
 * =================================================================== */
function init() {
  loadTheme();
  buildQueue();
  nextWord();
  renderCurrent();
  updateStats();
  updateWrongBadge();
  updateCetStat();
  renderChat();
  bindEvents();
}

init();
</script>
