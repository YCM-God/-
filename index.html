<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语背单词 · 四级高频词汇</title>
<style>
  /* ==================== 全局样式与主题变量 ==================== */
  :root {
    /* 浅色主题变量 */
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1f2430;
    --text-sub: #6b7280;
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --success: #22c55e;
    --danger: #ef4444;
    --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(31, 36, 48, 0.08);
    --chip-bg: #eef1ff;
  }

  /* 深色主题：给 <html> 或 <body> 加 .dark 类后覆盖变量 */
  body.dark {
    --bg: #12141c;
    --card-bg: #1c1f2b;
    --text: #e6e8ef;
    --text-sub: #9aa1b2;
    --primary: #6b84ff;
    --primary-dark: #5870e8;
    --success: #34d399;
    --danger: #f87171;
    --border: #2c3140;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --chip-bg: #262b3b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .3s, color .3s;
    -webkit-tap-highlight-color: transparent;
  }

  /* ==================== 布局容器 ==================== */
  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
  }

  /* ==================== 顶部栏 ==================== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 700;
  }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s;
  }
  .icon-btn:hover { transform: translateY(-1px); background: var(--chip-bg); }
  .icon-btn:active { transform: scale(.95); }

  /* ==================== 统计面板 ==================== */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .num {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
  }
  .stat-card .label {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 4px;
  }

  /* ==================== 模式切换 ==================== */
  .mode-tabs {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
    gap: 4px;
  }
  .mode-tabs button {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .mode-tabs button.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(79, 110, 247, .35);
  }

  /* ==================== 卡片 ==================== */
  .card-wrap {
    perspective: 1200px;
    margin-bottom: 16px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 300px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .5s;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card-back { transform: rotateY(180deg); }

  .word {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: .5px;
  }
  .phonetic {
    font-size: 15px;
    color: var(--text-sub);
    margin-top: 8px;
    font-style: normal;
  }
  .meaning {
    font-size: 22px;
    margin-top: 16px;
    font-weight: 600;
  }
  .hint {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 18px;
  }
  .speak-btn {
    margin-top: 16px;
    border: none;
    background: var(--chip-bg);
    color: var(--primary);
    font-size: 22px;
    width: 52px; height: 52px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform .15s;
  }
  .speak-btn:hover { transform: scale(1.08); }
  .speak-btn:active { transform: scale(.94); }

  /* ==================== 认识 / 不认识按钮 ==================== */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn {
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: transform .15s, filter .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn.dont { background: var(--danger); }
  .btn.know { background: var(--success); }
  .btn:hover { filter: brightness(1.08); }

  /* ==================== 拼写自测模式 ==================== */
  .spell-panel { display: none; }
  .spell-panel.visible { display: block; }

  .spell-word {
    font-size: 44px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 6px;
  }
  .spell-pos {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    margin-bottom: 20px;
  }
  #spell-input {
    width: 100%;
    padding: 16px;
    font-size: 20px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    text-align: center;
    letter-spacing: 1px;
    transition: border-color .2s;
  }
  #spell-input:focus { border-color: var(--primary); }

  .spell-result {
    margin-top: 14px;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    text-align: center;
    display: none;
  }
  .spell-result.correct { display: block; background: rgba(34,197,94,.12); color: var(--success); }
  .spell-result.wrong { display: block; background: rgba(239,68,68,.12); color: var(--danger); }

  .spell-actions { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn.check { background: var(--primary); grid-column: 1 / -1; }
  .btn.skip { background: var(--text-sub); }

  /* ==================== 听音选义模式 ==================== */
  .listen-panel { display: none; }
  .listen-panel.visible { display: block; }

  .listen-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 16px;
  }
  .listen-play {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(79, 110, 247, .4);
    transition: transform .15s;
  }
  .listen-play:hover { transform: scale(1.06); }
  .listen-play:active { transform: scale(.94); }
  .listen-hint {
    margin-top: 14px;
    color: var(--text-sub);
    font-size: 13px;
  }

  .listen-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .listen-opt {
    padding: 16px 12px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    min-height: 56px;
    line-height: 1.4;
  }
  .listen-opt:hover { border-color: var(--primary); }
  .listen-opt.correct { border-color: var(--success); background: rgba(34,197,94,.12); color: var(--success); }
  .listen-opt.wrong { border-color: var(--danger); background: rgba(239,68,68,.12); color: var(--danger); }

  .listen-result {
    margin-top: 14px;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    text-align: center;
    display: none;
  }
  .listen-result.correct { display: block; background: rgba(34,197,94,.12); color: var(--success); }
  .listen-result.wrong { display: block; background: rgba(239,68,68,.12); color: var(--danger); }

  /* ==================== 错题本 ==================== */
  .icon-btn { position: relative; }
  .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--danger); color: #fff;
    font-size: 10px; min-width: 16px; height: 16px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    padding: 0 4px; line-height: 1;
  }
  .badge.zero { display: none; }

  .review-banner {
    display: none;
    align-items: center; justify-content: space-between;
    gap: 10px;
    background: rgba(79, 110, 247, .12);
    border: 1px solid var(--primary);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--primary);
  }
  .review-banner.visible { display: flex; }
  .review-banner button {
    border: none; background: var(--primary); color: #fff;
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }

  .wrongbook-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .wrongbook-overlay.visible { display: flex; }
  .wrongbook {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%; max-width: 520px;
    max-height: 82vh;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .wrongbook-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .wrongbook-head h2 { font-size: 18px; font-weight: 700; }
  .wrongbook-meta { padding: 10px 20px; font-size: 13px; color: var(--text-sub); }
  .wrongbook-list { flex: 1; overflow-y: auto; padding: 4px 12px; }
  .wb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 8px; border-bottom: 1px solid var(--border);
  }
  .wb-item:last-child { border-bottom: none; }
  .wb-main { flex: 1; min-width: 0; }
  .wb-word { font-weight: 700; font-size: 16px; }
  .wb-mean { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .wb-speak, .wb-remove { flex-shrink: 0; }
  .wb-remove { color: var(--success); }
  .wb-empty { text-align: center; color: var(--text-sub); padding: 48px 0; font-size: 15px; }
  .wrongbook-foot {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border);
  }
  .btn.review { background: var(--primary); }
  .btn.clear { background: var(--text-sub); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  /* ==================== 提示与响应式 ==================== */
  .tip {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    margin-top: 16px;
    line-height: 1.6;
  }
  .progress {
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    margin-bottom: 10px;
  }

  @media (max-width: 480px) {
    .card { height: 260px; }
    .word { font-size: 32px; }
    .meaning { font-size: 19px; }
    .spell-word { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- 顶部栏 -->
  <header>
    <h1>📚 背单词</h1>
    <div class="header-actions">
      <button class="icon-btn" id="wb-btn" title="错题本">📕<span class="badge" id="wb-badge">0</span></button>
      <button class="icon-btn" id="theme-btn" title="切换主题">🌙</button>
    </div>
  </header>

  <!-- 学习统计面板 -->
  <div class="stats">
    <div class="stat-card">
      <div class="num" id="stat-today">0</div>
      <div class="label">今日学习</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-total">0</div>
      <div class="label">累计学习</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-rate">0%</div>
      <div class="label">正确率</div>
    </div>
  </div>

  <!-- 学习模式切换 -->
  <div class="mode-tabs">
    <button id="tab-card" class="active">🃏 卡片模式</button>
    <button id="tab-spell">✏️ 拼写自测</button>
    <button id="tab-listen">🎧 听音选义</button>
  </div>

  <!-- 错题复习提示条（仅在复习错题时显示） -->
  <div class="review-banner" id="review-banner">
    <span>📕 正在复习错题本（<span id="review-count">0</span> 个）</span>
    <button id="exit-review">退出复习</button>
  </div>

  <!-- ============ 卡片翻卡模式 ============ -->
  <div id="card-mode">
    <div class="progress" id="card-progress"></div>
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="word" id="front-word"></div>
          <div class="phonetic" id="front-phonetic"></div>
          <button class="speak-btn" id="front-speak" title="朗读">🔊</button>
          <div class="hint">点击卡片查看释义</div>
        </div>
        <div class="card-face card-back">
          <div class="word" id="back-word"></div>
          <div class="phonetic" id="back-phonetic"></div>
          <div class="meaning" id="back-meaning"></div>
          <button class="speak-btn" id="back-speak" title="朗读">🔊</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn dont" id="btn-dont">😕 不认识</button>
      <button class="btn know" id="btn-know">😊 认识</button>
    </div>
  </div>

  <!-- ============ 拼写自测模式 ============ -->
  <div class="spell-panel" id="spell-mode">
    <div class="progress" id="spell-progress"></div>
    <div class="spell-word" id="spell-meaning"></div>
    <div class="spell-pos">请根据中文释义，输入对应的英文单词</div>
    <input type="text" id="spell-input" placeholder="在这里输入英文单词…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="spell-result" id="spell-result"></div>
    <div class="spell-actions">
      <button class="btn check" id="btn-check">✅ 检查答案</button>
      <button class="btn skip" id="btn-skip">⏭ 跳过</button>
    </div>
  </div>

  <!-- ============ 听音选义模式 ============ -->
  <div class="listen-panel" id="listen-mode">
    <div class="progress" id="listen-progress"></div>
    <div class="listen-box">
      <button class="listen-play" id="listen-play" title="播放发音">🔊</button>
      <div class="listen-hint">听发音，选择正确的英文释义（点击喇叭可重播）</div>
    </div>
    <div class="listen-options" id="listen-options"></div>
    <div class="listen-result" id="listen-result"></div>
  </div>

  <p class="tip">💾 学习进度自动保存在浏览器中，刷新页面不丢失</p>
</div>

<!-- ============ 错题本面板（覆盖层） ============ -->
<div class="wrongbook-overlay" id="wrongbook-overlay">
  <div class="wrongbook">
    <div class="wrongbook-head">
      <h2>📕 错题本</h2>
      <button class="icon-btn" id="wb-close" title="返回">✖️</button>
    </div>
    <div class="wrongbook-meta" id="wb-meta"></div>
    <div class="wrongbook-list" id="wb-list"></div>
    <div class="wrongbook-foot">
      <button class="btn review" id="wb-review">🎯 复习错题</button>
      <button class="btn clear" id="wb-clear">🗑 清空</button>
    </div>
  </div>
</div>

<script>
/* ===================================================================
 * 四级高频词汇表（放在代码最顶部，方便随时增删修改）
 * 字段说明：word 英文单词 | phonetic 音标 | meaning 中文释义
 * =================================================================== */
const WORDS = [
  { word: "abandon", phonetic: "/əˈbændən/", meaning: "v. 放弃；抛弃" },
  { word: "ability", phonetic: "/əˈbɪləti/", meaning: "n. 能力；才能" },
  { word: "absorb", phonetic: "/əbˈzɔːrb/", meaning: "v. 吸收；吸引" },
  { word: "abstract", phonetic: "/ˈæbstrækt/", meaning: "adj. 抽象的 n. 摘要" },
  { word: "academic", phonetic: "/ˌækəˈdemɪk/", meaning: "adj. 学术的；学院的" },
  { word: "access", phonetic: "/ˈækses/", meaning: "n. 通道；接近 v. 访问" },
  { word: "accompany", phonetic: "/əˈkʌmpəni/", meaning: "v. 陪伴；伴随" },
  { word: "accomplish", phonetic: "/əˈkɑːmplɪʃ/", meaning: "v. 完成；实现" },
  { word: "accurate", phonetic: "/ˈækjərət/", meaning: "adj. 准确的；精确的" },
  { word: "achieve", phonetic: "/əˈtʃiːv/", meaning: "v. 达到；实现" },
  { word: "acquire", phonetic: "/əˈkwaɪər/", meaning: "v. 获得；学到" },
  { word: "adapt", phonetic: "/əˈdæpt/", meaning: "v. 适应；改编" },
  { word: "adequate", phonetic: "/ˈædɪkwət/", meaning: "adj. 足够的；适当的" },
  { word: "adjust", phonetic: "/əˈdʒʌst/", meaning: "v. 调整；适应" },
  { word: "admire", phonetic: "/ədˈmaɪər/", meaning: "v. 钦佩；欣赏" },
  { word: "advantage", phonetic: "/ədˈvæntɪdʒ/", meaning: "n. 优势；有利条件" },
  { word: "afford", phonetic: "/əˈfɔːrd/", meaning: "v. 负担得起；提供" },
  { word: "alternative", phonetic: "/ɔːlˈtɜːrnətɪv/", meaning: "n. 替代方案 adj. 供选择的" },
  { word: "ambition", phonetic: "/æmˈbɪʃn/", meaning: "n. 雄心；抱负" },
  { word: "analyze", phonetic: "/ˈænəlaɪz/", meaning: "v. 分析；解析" },
  { word: "ancient", phonetic: "/ˈeɪnʃənt/", meaning: "adj. 古代的；古老的" },
  { word: "annual", phonetic: "/ˈænjuəl/", meaning: "adj. 每年的 n. 年刊" },
  { word: "anxious", phonetic: "/ˈæŋkʃəs/", meaning: "adj. 焦虑的；渴望的" },
  { word: "apparent", phonetic: "/əˈpærənt/", meaning: "adj. 明显的；表面上的" },
  { word: "appeal", phonetic: "/əˈpiːl/", meaning: "v./n. 呼吁；吸引；上诉" },
  { word: "appreciate", phonetic: "/əˈpriːʃieɪt/", meaning: "v. 感激；欣赏" },
  { word: "approach", phonetic: "/əˈproʊtʃ/", meaning: "v. 接近 n. 方法" },
  { word: "appropriate", phonetic: "/əˈproʊpriət/", meaning: "adj. 适当的；恰当的" },
  { word: "approve", phonetic: "/əˈpruːv/", meaning: "v. 批准；赞成" },
  { word: "arise", phonetic: "/əˈraɪz/", meaning: "v. 出现；产生" },
  { word: "arrange", phonetic: "/əˈreɪndʒ/", meaning: "v. 安排；整理" },
  { word: "assess", phonetic: "/əˈses/", meaning: "v. 评估；评定" },
  { word: "assist", phonetic: "/əˈsɪst/", meaning: "v. 帮助；协助" },
  { word: "assume", phonetic: "/əˈsuːm/", meaning: "v. 假定；承担" },
  { word: "attach", phonetic: "/əˈtætʃ/", meaning: "v. 附上；系上" },
  { word: "attitude", phonetic: "/ˈætɪtuːd/", meaning: "n. 态度；看法" },

/* ===================================================================
 * 核心数据与状态管理
 * =================================================================== */
const STORAGE_KEY = "wordbook_records_v1";   // localStorage 存储键名

// 默认学习记录结构
const DEFAULT_DATA = {
  records: {},          // { 单词: { count: 学习次数, correct: 正确次数, know: 是否认识 } }
  today: "2026-01-01",  // 记录今日学习对应的日期
  todayCount: 0,        // 今日学习数量
  totalCount: 0,        // 累计学习数量
  totalCorrect: 0,      // 累计正确次数
  wrongBook: []         // 错题本：存放答错/不认识的单词
};

let data = loadData();          // 从 localStorage 加载数据
let currentWord = null;         // 当前正在学习的单词对象
let currentIndex = -1;          // 当前单词在复习队列中的下标
let queue = [];                 // 复习队列（生词排在前面）
let mode = "card";              // 当前模式：card / spell / listen
let listenOptions = [];         // 当前听音题的选项列表
let listenAnswered = false;     // 当前听音题是否已作答
let spellAnswered = false;      // 当前拼写题是否已作答（防止重复判定）
let reviewingWrong = false;     // 是否正在复习错题

/* ---------- 数据持久化 ---------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // 合并默认值，防止旧数据结构缺少字段导致报错
      return { ...DEFAULT_DATA, ...parsed, records: parsed.records || {}, wrongBook: Array.isArray(parsed.wrongBook) ? parsed.wrongBook : [] };
    }
  } catch (e) { /* 数据损坏时忽略，重新开始 */ }
  return { ...DEFAULT_DATA, records: {} };
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { /* 存储失败（如隐私模式）时静默处理 */ }
}

/* ===================================================================
 * 复习队列：生词优先
 * 每个单词维护一个“待复习权重”，不认识的词权重更高、更靠前
 * =================================================================== */
function buildQueue() {
  // 复习错题时只对错题本中的单词建队，否则使用完整词库
  let source = WORDS;
  if (reviewingWrong) {
    const wrongWords = WORDS.filter(function (w) {
      return data.wrongBook.indexOf(w.word) !== -1;
    });
    if (wrongWords.length > 0) {
      source = wrongWords;
    } else {
      // 复习过程中错题全部掌握，自动退出复习模式
      reviewingWrong = false;
      document.getElementById("review-banner").classList.remove("visible");
    }
  }

  // 计算每个单词的复习优先级：不认识记 2 分，认识记 0 分，从未学过的记 1 分
  const scored = source.map(function (w, idx) {
    const rec = data.records[w.word];
    let priority = 1; // 默认：新词
    if (rec) {
      priority = rec.know ? 0 : 2; // 认识=0（靠后），不认识=2（最优先）
    }
    // 加入少量随机扰动，避免每次都按固定顺序
    return { word: w, idx: idx, priority: priority + Math.random() * 0.5 };
  });
  // 按优先级降序排列，生词在前
  scored.sort(function (a, b) { return b.priority - a.priority; });
  queue = scored;
  currentIndex = 0;
}

/* 从队列取出当前单词，若走到队尾则重新洗牌建队 */
function nextWord() {
  if (currentIndex >= queue.length) {
    buildQueue(); // 一轮学完，重新按生词优先排序
  }
  currentWord = queue[currentIndex].word;
}

/* ===================================================================
 * 统计面板更新
 * =================================================================== */
function updateStats() {
  // 跨天后重置“今日学习”计数
  const todayStr = new Date().toISOString().slice(0, 10);
  if (data.today !== todayStr) {
    data.today = todayStr;
    data.todayCount = 0;
    saveData();
  }
  document.getElementById("stat-today").textContent = data.todayCount;
  document.getElementById("stat-total").textContent = data.totalCount;
  const rate = data.totalCount === 0
    ? 0
    : Math.round((data.totalCorrect / data.totalCount) * 100);
  document.getElementById("stat-rate").textContent = rate + "%";
}

/* ===================================================================
 * 卡片模式渲染
 * =================================================================== */
function renderCard() {
  if (!currentWord) return;
  document.getElementById("front-word").textContent = currentWord.word;
  document.getElementById("front-phonetic").textContent = currentWord.phonetic;
  document.getElementById("back-word").textContent = currentWord.word;
  document.getElementById("back-phonetic").textContent = currentWord.phonetic;
  document.getElementById("back-meaning").textContent = currentWord.meaning;

  // 进度显示：当前是第几个 / 总共多少个
  document.getElementById("card-progress").textContent =
    "第 " + (currentIndex + 1) + " / " + queue.length + " 个单词";

  // 每次换词时重置翻卡状态（回到正面）
  document.getElementById("card").classList.remove("flipped");
}

/* ===================================================================
 * 拼写自测模式渲染
 * =================================================================== */
function renderSpell() {
  if (!currentWord) return;
  spellAnswered = false;
  document.getElementById("spell-meaning").textContent = currentWord.meaning;
  document.getElementById("spell-input").value = "";
  document.getElementById("spell-result").className = "spell-result";
  document.getElementById("spell-result").textContent = "";
  document.getElementById("spell-progress").textContent =
    "第 " + (currentIndex + 1) + " / " + queue.length + " 个单词";
  // 自动聚焦输入框
  setTimeout(() => document.getElementById("spell-input").focus(), 50);
}

/* ===================================================================
 * 记录一次学习结果
 * @param know  是否认识 / 拼写是否正确
 * =================================================================== */
function recordResult(correct) {
  const w = currentWord.word;
  // 初始化该单词的记录
  if (!data.records[w]) {
    data.records[w] = { count: 0, correct: 0, know: false };
  }
  const rec = data.records[w];
  rec.count += 1;
  if (correct) {
    rec.correct += 1;
    rec.know = true;    // 认识 / 拼写正确，标记为已掌握
  } else {
    rec.know = false;   // 不认识 / 拼写错误，标记为生词，下次优先复习
  }

  // 更新错题本：答错加入，答对移出
  if (correct) {
    const wi = data.wrongBook.indexOf(w);
    if (wi !== -1) data.wrongBook.splice(wi, 1);
  } else if (data.wrongBook.indexOf(w) === -1) {
    data.wrongBook.push(w);
  }

  // 更新全局统计
  data.totalCount += 1;
  if (correct) data.totalCorrect += 1;
  data.todayCount += 1;

  saveData();
  updateStats();
  updateWrongBadge();

  // 跳到下一个单词
  currentIndex += 1;
  nextWord();
  renderCurrent();
}

/* 根据当前模式渲染对应界面 */
function renderCurrent() {
  if (mode === "card") {
    renderCard();
  } else if (mode === "spell") {
    renderSpell();
  } else {
    renderListen();
  }
}

/* ===================================================================
 * 听音选义模式渲染
 * =================================================================== */
function renderListen() {
  if (!currentWord) return;
  listenAnswered = false;

  // 构造 4 个选项：1 个正确释义 + 3 个从其它单词随机抽取的干扰释义
  const correct = currentWord.meaning;
  const others = WORDS.filter(function (w) { return w.word !== currentWord.word; });
  const distractorMeanings = [];
  const shuffled = shuffleArray(others);
  for (let i = 0; i < shuffled.length && distractorMeanings.length < 3; i++) {
    const m = shuffled[i].meaning;
    // 避免与正确答案或已有干扰项重复
    if (m !== correct && distractorMeanings.indexOf(m) === -1) {
      distractorMeanings.push(m);
    }
  }
  // 若干扰项不足 3 个（极小概率），从整个词库兜底补齐
  if (distractorMeanings.length < 3) {
    const all = WORDS.map(function (w) { return w.meaning; });
    for (let i = 0; i < all.length && distractorMeanings.length < 3; i++) {
      if (all[i] !== correct && distractorMeanings.indexOf(all[i]) === -1) {
        distractorMeanings.push(all[i]);
      }
    }
  }

  // 正确答案 + 干扰项混合后再次洗牌
  listenOptions = shuffleArray([correct].concat(distractorMeanings));

  // 渲染选项按钮
  const box = document.getElementById("listen-options");
  box.innerHTML = "";
  listenOptions.forEach(function (opt, i) {
    const btn = document.createElement("button");
    btn.className = "listen-opt";
    btn.textContent = opt;
    btn.dataset.index = i;
    btn.addEventListener("click", function () { checkListen(i); });
    box.appendChild(btn);
  });

  document.getElementById("listen-result").textContent = "";
  document.getElementById("listen-result").className = "listen-result";
  document.getElementById("listen-progress").textContent =
    "第 " + (currentIndex + 1) + " / " + queue.length + " 个单词";

  // 自动朗读单词
  speak(currentWord.word);
}

/* 数组洗牌工具函数（返回新数组，不修改原数组） */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 听音选义：判断所选选项是否正确 */
function checkListen(index) {
  if (listenAnswered) return; // 已作答，忽略重复点击
  listenAnswered = true;

  const correct = listenOptions[index] === currentWord.meaning;
  const btns = document.querySelectorAll(".listen-opt");
  const resultEl = document.getElementById("listen-result");

  // 高亮：正确选项标绿，选错的标红，并禁用所有选项
  btns.forEach(function (btn, i) {
    btn.disabled = true;
    if (listenOptions[i] === currentWord.meaning) {
      btn.classList.add("correct");
    } else if (i === index) {
      btn.classList.add("wrong");
    }
  });

  if (correct) {
    resultEl.textContent = "✅ 选择正确！ " + currentWord.word + " — " + currentWord.meaning;
    resultEl.className = "listen-result correct";
  } else {
    resultEl.textContent = "❌ 选择错误，正确释义：" + currentWord.meaning;
    resultEl.className = "listen-result wrong";
  }

  // 显示结果后延迟 1.2 秒自动进入下一题
  setTimeout(function () { recordResult(correct); }, 1200);
}

/* ===================================================================
 * 单词朗读（使用浏览器内置语音合成 API，无需联网）
 * =================================================================== */
function speak(word) {
  // 若浏览器不支持语音合成则直接返回
  if (!window.speechSynthesis) return;
  // 先停止上一次尚未结束的朗读，避免重叠
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = "en-US";   // 英语发音
  utter.rate = 0.9;       // 语速稍慢，便于跟读
  window.speechSynthesis.speak(utter);
}

/* ===================================================================
 * 模式切换
 * =================================================================== */
function setMode(m) {
  mode = m;
  document.getElementById("tab-card").classList.toggle("active", m === "card");
  document.getElementById("tab-spell").classList.toggle("active", m === "spell");
  document.getElementById("tab-listen").classList.toggle("active", m === "listen");
  document.getElementById("card-mode").style.display = m === "card" ? "block" : "none";
  document.getElementById("spell-mode").classList.toggle("visible", m === "spell");
  document.getElementById("listen-mode").classList.toggle("visible", m === "listen");
  renderCurrent();
}

/* ===================================================================
 * 主题切换
 * =================================================================== */
function toggleTheme() {
  const dark = document.body.classList.toggle("dark");
  document.getElementById("theme-btn").textContent = dark ? "☀️" : "🌙";
  // 保存主题偏好
  try { localStorage.setItem("wordbook_theme", dark ? "dark" : "light"); } catch (e) {}
}

function loadTheme() {
  let dark = false;
  try { dark = localStorage.getItem("wordbook_theme") === "dark"; } catch (e) {}
  if (dark) {
    document.body.classList.add("dark");
    document.getElementById("theme-btn").textContent = "☀️";
  }
}

/* ===================================================================
 * 事件绑定
 * =================================================================== */
function bindEvents() {
  // 卡片点击翻面（点击朗读按钮时不触发翻面）
  document.getElementById("card").addEventListener("click", function () {
    this.classList.toggle("flipped");
  });

  // 卡片正反面朗读按钮
  document.getElementById("front-speak").addEventListener("click", function (e) {
    e.stopPropagation(); // 阻止冒泡，避免同时翻卡
    speak(currentWord.word);
  });
  document.getElementById("back-speak").addEventListener("click", function (e) {
    e.stopPropagation();
    speak(currentWord.word);
  });

  // 认识 / 不认识
  document.getElementById("btn-know").addEventListener("click", function () {
    recordResult(true);
  });
  document.getElementById("btn-dont").addEventListener("click", function () {
    recordResult(false);
  });

  // 拼写检查
  document.getElementById("btn-check").addEventListener("click", checkSpell);
  document.getElementById("spell-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") checkSpell(); // 回车直接检查
  });

  // 跳过（记作不认识/错误，但不显示答案，直接换词）
  document.getElementById("btn-skip").addEventListener("click", function () {
    recordResult(false);
  });

  // 模式切换
  document.getElementById("tab-card").addEventListener("click", function () { setMode("card"); });
  document.getElementById("tab-spell").addEventListener("click", function () { setMode("spell"); });
  document.getElementById("tab-listen").addEventListener("click", function () { setMode("listen"); });

  // 听音选义：点击喇叭重播发音
  document.getElementById("listen-play").addEventListener("click", function () {
    speak(currentWord.word);
  });

  // 错题本：打开 / 关闭 / 复习 / 清空 / 退出复习
  document.getElementById("wb-btn").addEventListener("click", openWrongBook);
  document.getElementById("wb-close").addEventListener("click", closeWrongBook);
  document.getElementById("wrongbook-overlay").addEventListener("click", function (e) {
    if (e.target === this) closeWrongBook(); // 点击遮罩空白处关闭
  });
  document.getElementById("wb-review").addEventListener("click", startWrongReview);
  document.getElementById("wb-clear").addEventListener("click", function () {
    data.wrongBook = [];
    saveData();
    updateWrongBadge();
    renderWrongBook();
    if (reviewingWrong) exitWrongReview(); // 正在复习时清空，则退出复习
  });
  document.getElementById("exit-review").addEventListener("click", exitWrongReview);

  // 主题切换
  document.getElementById("theme-btn").addEventListener("click", toggleTheme);
}

/* 拼写检查逻辑 */
function checkSpell() {
  const input = document.getElementById("spell-input").value.trim();
  if (!input || spellAnswered) return; // 空输入或已作答不处理
  spellAnswered = true;
  const correct = input.toLowerCase() === currentWord.word.toLowerCase();
  const resultEl = document.getElementById("spell-result");

  if (correct) {
    resultEl.textContent = "✅ 回答正确！ " + currentWord.word;
    resultEl.className = "spell-result correct";
  } else {
    resultEl.textContent = "❌ 回答错误，正确答案：" + currentWord.word;
    resultEl.className = "spell-result wrong";
    // 拼错时朗读正确发音，加深记忆
    speak(currentWord.word);
  }

  // 显示结果后延迟 1.2 秒自动进入下一个词
  setTimeout(function () {
    // 若期间用户已切词，避免重复记录
    recordResult(correct);
  }, 1200);
}

/* ===================================================================
 * 错题本
 * =================================================================== */
function updateWrongBadge() {
  const n = data.wrongBook.length;
  const badge = document.getElementById("wb-badge");
  badge.textContent = n;
  badge.classList.toggle("zero", n === 0);
}

function openWrongBook() {
  renderWrongBook();
  document.getElementById("wrongbook-overlay").classList.add("visible");
}

function closeWrongBook() {
  document.getElementById("wrongbook-overlay").classList.remove("visible");
}

function renderWrongBook() {
  const list = document.getElementById("wb-list");
  list.innerHTML = "";
  document.getElementById("wb-meta").textContent = "共 " + data.wrongBook.length + " 个错题";

  // 错题本为空时的占位提示
  if (data.wrongBook.length === 0) {
    list.innerHTML = '<div class="wb-empty">🎉 太棒了，暂无错题！</div>';
    document.getElementById("wb-review").disabled = true;
    document.getElementById("wb-clear").disabled = true;
    return;
  }
  document.getElementById("wb-review").disabled = false;
  document.getElementById("wb-clear").disabled = false;

  // 逐条渲染错题
  data.wrongBook.forEach(function (wordStr) {
    const w = WORDS.find(function (x) { return x.word === wordStr; });
    if (!w) return; // 词库中已删除该词时跳过

    const item = document.createElement("div");
    item.className = "wb-item";

    // 单词 + 音标 + 释义
    const main = document.createElement("div");
    main.className = "wb-main";
    const wordEl = document.createElement("div");
    wordEl.className = "wb-word";
    wordEl.textContent = w.word;
    const phEl = document.createElement("span");
    phEl.style.cssText = "color:var(--text-sub);font-size:12px;font-weight:400";
    phEl.textContent = " " + w.phonetic;
    wordEl.appendChild(phEl);
    const meanEl = document.createElement("div");
    meanEl.className = "wb-mean";
    meanEl.textContent = w.meaning;
    main.appendChild(wordEl);
    main.appendChild(meanEl);

    // 朗读按钮
    const speakBtn = document.createElement("button");
    speakBtn.className = "icon-btn wb-speak";
    speakBtn.textContent = "🔊";
    speakBtn.title = "朗读";
    speakBtn.addEventListener("click", function () { speak(w.word); });

    // 标记已掌握并移除
    const rmBtn = document.createElement("button");
    rmBtn.className = "icon-btn wb-remove";
    rmBtn.textContent = "✓";
    rmBtn.title = "标记已掌握并移除";
    rmBtn.addEventListener("click", function () {
      const idx = data.wrongBook.indexOf(w.word);
      if (idx !== -1) data.wrongBook.splice(idx, 1);
      saveData();
      updateWrongBadge();
      renderWrongBook();
    });

    item.appendChild(main);
    item.appendChild(speakBtn);
    item.appendChild(rmBtn);
    list.appendChild(item);
  });
}

/* 开始复习错题（在当前模式下仅学习错题本中的单词） */
function startWrongReview() {
  if (data.wrongBook.length === 0) return; // 没错题不启动
  reviewingWrong = true;
  closeWrongBook();
  buildQueue();
  nextWord();
  renderCurrent();
  document.getElementById("review-banner").classList.add("visible");
  document.getElementById("review-count").textContent = data.wrongBook.length;
}

/* 退出错题复习，恢复正常学习 */
function exitWrongReview() {
  reviewingWrong = false;
  document.getElementById("review-banner").classList.remove("visible");
  buildQueue();
  nextWord();
  renderCurrent();
}

/* ===================================================================
 * 初始化
 * =================================================================== */
function init() {
  loadTheme();
  buildQueue();
  nextWord();
  renderCurrent();
  updateStats();
  updateWrongBadge();
  bindEvents();
}

init();
</script>
